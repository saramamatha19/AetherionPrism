# Every setting lives here. A missing setting is an error.
# Learned values (gate, thresholds) are NOT here: they are saved with each model.

# Who answers the user: model_only | gated | shadow
mode: shadow

# When the model answers alone, it must be right at least this often.
# The gate is computed from this in Phase 4 (never typed by hand).
accuracy_floor: 0.80

# How train is cut into slices (Phase 3). Same seed → same split every run.
seed: 42
threshold_slice_size: 500
gate_slice_size: 500

# Fine-tuning (Phase 4c): how many passes over the pairs, and pairs per nudge.
finetune_epochs: 1
finetune_batch_size: 16
finetune_augment_count: 1000  # augmented negation questions added to fine-tuning (0 = none)
# Split fix: fine-tune BGE on one half of fit, train the judges on the other half (never the same questions)
finetune_on_fit_half: true

# Negation rule: questions with "not", "except", "skip", … always go to the LLM (the model is
# confidently wrong on many of them). The model's real confidence is still kept for the logs.
negation_to_llm: true

# LLM fallback (Phase 5). The API key is NOT here: it lives in .env (never in git).
llm_model: "gpt-4o-2024-11-20"   # one exact version, so results are repeatable
llm_timeout_seconds: 10          # give up after 10 s (the prototype saw calls of up to 11 s)
llm_max_retries: 2               # try again up to 2 times on a temporary error (e.g. rate limit)

# Which prompt the LLM gets (prompts live in llm.py; v1 never changes, new versions are added)
llm_prompt_version: "v4"

# LLM prices, $ per 1 million tokens, with source + date. Add a line for every model you try.
llm_prices:
  gpt-4o-2024-11-20: {input: 2.50, cached_input: 1.25, output: 10.00, source: "OpenRouter, checked 2026-10-12"}
  gpt-5-2025-08-07: {input: 1.25, cached_input: 1.25, output: 10.00, source: "user, 2026-10-12 (cached price not given; caching not used yet)"}

# Prompt practice set (from TRAIN, never eval): this many questions of each question type
prompt_practice_per_type: 28

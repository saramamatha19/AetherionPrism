[project]
name = "prism"
version = "0.1.0"
description = "Source Router: a small model picks where to search; an LLM handles only the hard questions"
authors = [
    { name = "saramamatha19", email = "sara.mamatha@calfus.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.6.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

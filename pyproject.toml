[project]
name = "prism"
version = "0.1.0"
description = "Source Router: a small model picks where to search; an LLM handles only the hard questions"
authors = [
    { name = "saramamatha19", email = "sara.mamatha@calfus.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "joblib>=1.6.0",
    "laya>=0.4.4",
    "openai>=3.28.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers[train]>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",  # listed so the CPU-only rule below can apply (it comes with sentence-transformers)
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# Docker (Linux): CPU-only PyTorch. The normal Linux one adds ~3 GB of NVIDIA GPU code Prism never
# uses. On the Mac nothing changes (the rule only applies on Linux).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only torch comes from here; everything else from the normal place

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100   # the width our code is written in; keeps the formatter from re-wrapping lines
